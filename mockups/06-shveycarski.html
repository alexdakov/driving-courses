<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · Швейцарски</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* Concept: International Typographic Style. Strict grid, hairline rules, huge numerals, black on white with one red. */
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #6b6b6b; --card: #fff; --line: #0a0a0a;
  --accent: #e30613; --accent-fg: #fff; --ok: #0a0a0a; --no: #e30613; --mnem-bg: #f2f2f2; --mnem-fg: #0a0a0a;
  --radius: 0px; --font: "IBM Plex Sans", sans-serif; --font-mono: "IBM Plex Mono", monospace;
  --x-grass: #f2f2f2; --x-road: #0a0a0a; --x-paint: #fff; --x-car-a: #e30613; --x-car-b: #0a0a0a; --x-car-c: #8a8a8a;
}
body { font-size: 16px; }
.grid { max-width: 1200px; margin: 0 auto; padding: 0 24px 90px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 24px; }
.rule { grid-column: 1 / -1; border-top: 1px solid var(--fg); margin-top: 60px; padding-top: 10px; display: grid; grid-template-columns: subgrid; }
.rule .lbl { grid-column: 1 / 4; font-family: var(--font-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.rule .body { grid-column: 4 / -1; }
.mast { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; padding-top: 24px; }
.mast .id { grid-column: 1 / 4; font-family: var(--font-mono); font-size: .78rem; line-height: 1.4; }
.mast .id i { display: inline-block; width: 14px; height: 14px; background: var(--accent); vertical-align: -2px; margin-right: 6px; }
.mast h1 { grid-column: 4 / -1; font-size: clamp(2.6rem, 6.5vw, 5.6rem); font-weight: 700; letter-spacing: -.035em; line-height: .95; }
.mast p { grid-column: 4 / 10; margin-top: 18px; font-size: 1.15rem; }
.big { grid-column: 4 / -1; display: flex; gap: 40px; margin-top: 30px; }
.big div { font-size: .8rem; font-family: var(--font-mono); text-transform: uppercase; }
.big b { display: block; font-family: var(--font); font-size: 3.4rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.big b.r { color: var(--accent); }
.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); border-top: 1px solid var(--fg); }
.k-ch { display: grid; grid-template-columns: 52px minmax(0, 1fr); padding: 12px 10px 14px 0; border-bottom: 1px solid var(--fg); }
.k-ch-n { font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.k-ch-t { font-weight: 700; }
.k-ch small { grid-column: 2; color: var(--muted); }
.k-ch:hover .k-ch-n { color: var(--accent); }
.k-md-list button[aria-selected="true"] { border-color: var(--fg); background: var(--fg); color: #fff; }
.k-md-detail { border-color: var(--fg); }
.k-kind { border-radius: 0 !important; background: var(--fg) !important; color: #fff !important; }
.k-mnem { border-left: 6px solid var(--accent); }
.k-name { font-size: 1.6rem; letter-spacing: -.02em; }
.xanim-play, .k-btn { border-radius: 0; }
.k-opt { border-radius: 0; }
.k-opt.is-right { box-shadow: inset 6px 0 0 var(--fg); }
.k-opt.is-wrong { box-shadow: inset 6px 0 0 var(--accent); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } .rule, .mast { grid-template-columns: minmax(0, 1fr); } .rule .lbl, .rule .body, .mast > * { grid-column: 1 !important; } .rule .lbl { margin-bottom: 14px; } .cols { grid-template-columns: minmax(0, 1fr); } .big { flex-wrap: wrap; gap: 20px; } }
</style>
</head>
<body>
<main class="grid">
  <section class="mast">
    <div class="id"><i></i>Курс<br>Категория B<br>ЗДвП 2025</div>
    <h1>Шофьорски опреснителен курс</h1>
    <p>Правилата за пътя, подредени ясно. Всеки знак с обяснение на човешки език и кратка подсказка как да го запомниш.</p>
    <div class="big"><div><b>11</b>Глави</div><div><b>182</b>Знака</div><div><b class="r">34%</b>Преминато</div></div>
  </section>
  <section class="rule"><div class="lbl">01 · Глави</div><div class="body"><div class="toc" data-k-chapters="plain"></div></div></section>
  <section class="rule"><div class="lbl">02 · Пътни знаци</div><div class="body" data-k-pattern="masterDetail"></div></section>
  <section class="rule"><div class="lbl">03 · Упражнения</div><div class="body cols"><div data-k-anim="equal"></div><div data-k-quiz></div></div></section>
</main>
<script src="../js/signs-data.js"></script><script src="../js/anim.js"></script><script src="kit.js"></script><script>Kit.auto()</script>
</body>
</html>
